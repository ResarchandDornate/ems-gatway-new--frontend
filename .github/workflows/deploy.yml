name: Deploy Unity-EMS Portal

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-unity-ems
  cancel-in-progress: false

jobs:
  deploy:
    uses: Ornate-solar-resarchd/portals-infra/.github/workflows/_deploy-template.yml@main
    with:
      portal:       unity-ems
      portal_dir:   unity-ems
      services:     "unity-ems-web"
      health_url:   "https://ems.unityess.cloud/"
      runner_label: unity-ems
