# Builds the signed Android App Bundle that gets uploaded to Play.
#
# Separate from android-debug-apk.yml, and dispatch-only, because this one needs
# the upload key. A release build on every push would mean the key sitting in an
# environment that every push can reach.
#
# It stops at the artifact. Uploading to Play is done by hand, from the Console,
# by whoever owns the account — deliberately: the first upload of an app is also
# the moment its package name and signing identity are fixed forever.
name: Android release AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Marketing version shown in Play, e.g. 1.0.0"
        required: true
        default: "1.0.0"
      version_code:
        description: >-
          Integer Play uses to order releases. Must be higher than every code
          already uploaded. Blank uses the workflow run number, which only ever
          increases.
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android_app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: android_app
        run: npm ci

      # No api_base input here, unlike the debug workflow. A release build that
      # points anywhere but the deployed proxy is not a release build, so the
      # value comes from .env.production in the repo and is not overridable from
      # a dispatch form.
      - name: Build web bundle
        working-directory: android_app
        env:
          VITE_APP_TOKEN: ${{ secrets.GW_APP_TOKEN }}
        run: npm run build

      - name: Confirm the bundle points at the deployed proxy
        working-directory: android_app
        # A release that shipped with an empty API base would install, launch,
        # and show dashes on every screen with nothing in any log to explain it.
        # Cheaper to fail here than to find out from a store review.
        run: |
          if ! grep -qr "https://ems.unityess.cloud" dist/assets/*.js; then
            echo "::error::No deployed API base in the bundle. Check android_app/.env.production."
            exit 1
          fi
          echo "API base present."

      - name: Copy bundle into the native project
        working-directory: android_app
        run: npx cap sync android

      - name: Restore the upload key
        working-directory: android_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See android/keystore.properties.example."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > unityess-upload.jks
          # Written rather than echoed: these are the key's passwords.
          {
            echo "storeFile=unityess-upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Bundle release
        working-directory: android_app/android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace \
            -PversionName="${{ github.event.inputs.version_name }}" \
            -PversionCode="${{ github.event.inputs.version_code || github.run_number }}"

      - name: Remove the key from the runner
        if: always()
        working-directory: android_app/android
        run: rm -f unityess-upload.jks keystore.properties

      - name: Confirm the bundle is signed
        run: |
          AAB=$(ls android_app/android/app/build/outputs/bundle/release/*.aab)
          echo "$AAB"
          ls -lh "$AAB"
          # An unsigned bundle builds happily and is refused at upload. The
          # signature block is inside the zip, so its presence is checkable here.
          if unzip -l "$AAB" | grep -qE "META-INF/.*\.(RSA|EC|DSA)"; then
            echo "Signed."
          else
            echo "::error::No signature block. The release signingConfig did not apply."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: unityess-release-aab
          path: android_app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90
